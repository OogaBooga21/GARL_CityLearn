<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

    <div class="header">
        <h1>KPI Dashboard</h1>
        <button id="addViewBtn">Add View</button>
    </div>

    <div id="dashboard">
        <!-- Views will be dynamically inserted here -->
    </div>

    <!-- Modal for adding a new trace -->
    <div id="addTraceModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Add Metric to Plot</h2>
            <select id="modalRunSelector"></select>
            <select id="modalKpiSelector"></select>
            <input type="color" id="modalColorPicker" value="#ff0000">
            <button id="addTraceBtn">Add Trace</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = document.getElementById('dashboard');
            const addViewBtn = document.getElementById('addViewBtn');
            const modal = document.getElementById('addTraceModal');
            const closeModal = document.querySelector('.close-button');
            const addTraceBtn = document.getElementById('addTraceBtn');
            const modalRunSelector = document.getElementById('modalRunSelector');
            const modalKpiSelector = document.getElementById('modalKpiSelector');
            const modalColorPicker = document.getElementById('modalColorPicker');

            let availableRuns = [];
            let availableKPIs = {};
            let viewStates = []; // Each state will now include a 'metrics' array
            let activeView = null; // The view currently interacting with the modal

            async function fetchInitialData() {
                const response = await fetch('available_data.json');
                const data = await response.json();
                availableRuns = data.runs;
                availableKPIs = data.kpis;

                populateRunSelector(modalRunSelector, availableRuns);
                modalRunSelector.addEventListener('change', () => {
                    populateKpiSelector(modalKpiSelector, availableKPIs[modalRunSelector.value]);
                });
                if (availableRuns.length > 0) {
                    populateKpiSelector(modalKpiSelector, availableKPIs[availableRuns[0]]);
                }
            }

            function populateRunSelector(selector, runs) {
                selector.innerHTML = '';
                runs.forEach(runId => {
                    const option = new Option(runId, runId);
                    selector.add(option);
                });
            }

            function populateKpiSelector(selector, kpis) {
                selector.innerHTML = '';
                if (kpis) {
                    kpis.forEach(kpi => {
                        const option = new Option(kpi.name, kpi.path);
                        selector.add(option);
                    });
                }
            }

            function createView(state, index) {
                const view = document.createElement('div');
                view.className = 'view';
                view.dataset.id = index;

                const header = document.createElement('div');
                header.className = 'view-header';

                const tokenContainer = document.createElement('div');
                tokenContainer.className = 'token-container';

                const addTraceModalBtn = document.createElement('button');
                addTraceModalBtn.innerText = '+';
                addTraceModalBtn.addEventListener('click', () => {
                    activeView = view;
                    modal.style.display = 'flex';
                });

                const closeBtn = document.createElement('button');
                closeBtn.className = 'close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.addEventListener('click', () => removeView(index));

                header.appendChild(addTraceModalBtn);
                header.appendChild(tokenContainer);
                header.appendChild(closeBtn);

                const plotContainer = document.createElement('div');
                plotContainer.className = 'plot-container';
                
                view.appendChild(header);
                view.appendChild(plotContainer);

                dashboard.appendChild(view);
                
                Plotly.newPlot(plotContainer, [], {title: 'Blank Canvas'});

                // Render existing tokens if any
                renderTokens(view, index);
            }

            function generateColorShades(hexColor, count) {
                const shades = [];
                const baseColor = parseInt(hexColor.slice(1), 16);
                let r = (baseColor >> 16) & 255;
                let g = (baseColor >> 8) & 255;
                let b = baseColor & 255;

                for (let i = 0; i < count; i++) {
                    // Adjust factor to create more distinct shades
                    const factor = 1 - (i * 0.08); // Smaller step for more shades
                    const newR = Math.max(0, Math.min(255, Math.round(r * factor)));
                    const newG = Math.max(0, Math.min(255, Math.round(g * factor)));
                    const newB = Math.max(0, Math.min(255, Math.round(b * factor)));
                    shades.push(`rgb(${newR},${newG},${newB})`);
                }
                return shades;
            }

            async function addTraceToPlot() {
                if (!activeView) return;

                const run = modalRunSelector.value;
                const kpi = modalKpiSelector.value;
                const color = modalColorPicker.value;
                const plotContainer = activeView.querySelector('.plot-container');
                const viewIndex = parseInt(activeView.dataset.id);

                const response = await fetch(`/api/kpi/${run}/${kpi}`);
                const data = await response.json();

                const yCols = Object.keys(data).filter(k => k !== 'timestamp');
                const shades = generateColorShades(color, yCols.length);
                const traceNames = [];

                yCols.forEach((col, i) => {
                    const traceName = `${run} - ${col}`;
                    Plotly.addTraces(plotContainer, {
                        x: data.timestamp,
                        y: data[col],
                        name: traceName,
                        line: { color: shades[i] }
                    });
                    traceNames.push(traceName);
                });

                // Store metric info in viewStates
                if (!viewStates[viewIndex].metrics) {
                    viewStates[viewIndex].metrics = [];
                }
                viewStates[viewIndex].metrics.push({ run, kpi, color, traceNames });
                
                renderTokens(activeView, viewIndex); // Re-render tokens for the active view
                modal.style.display = 'none';
            }

            function removeTrace(viewIndex, metricIndex) {
                const view = dashboard.querySelector(`[data-id="${viewIndex}"]`);
                const plotContainer = view.querySelector('.plot-container');
                const metricToRemove = viewStates[viewIndex].metrics[metricIndex];

                if (!metricToRemove) return;

                // Get current trace names in the plot
                const currentPlotTraces = plotContainer.data.map(trace => trace.name);
                const indicesToDelete = [];

                metricToRemove.traceNames.forEach(name => {
                    const idx = currentPlotTraces.indexOf(name);
                    if (idx !== -1) {
                        indicesToDelete.push(idx);
                    }
                });
                
                // Sort in descending order to avoid index shifting issues during deletion
                indicesToDelete.sort((a, b) => b - a);

                Plotly.deleteTraces(plotContainer, indicesToDelete);

                // Remove the metric from viewStates
                viewStates[viewIndex].metrics.splice(metricIndex, 1);

                renderTokens(view, viewIndex); // Re-render tokens for the active view
            }

            function renderTokens(view, viewIndex) {
                const tokenContainer = view.querySelector('.token-container');
                tokenContainer.innerHTML = ''; // Clear existing tokens

                const metrics = viewStates[viewIndex].metrics || [];

                metrics.forEach((metric, metricIndex) => {
                    const token = document.createElement('span');
                    token.className = 'metric-token';
                    token.style.borderColor = metric.color;

                    const tokenText = document.createElement('span');
                    tokenText.innerText = `${metric.run} - ${metric.kpi}`;
                    token.appendChild(tokenText);

                    const closeTokenBtn = document.createElement('button');
                    closeTokenBtn.className = 'close-token-btn';
                    closeTokenBtn.innerHTML = '&times;';
                    closeTokenBtn.onclick = () => removeTrace(viewIndex, metricIndex);
                    token.appendChild(closeTokenBtn);

                    tokenContainer.appendChild(token);
                });
            }

            function renderDashboard() {
                dashboard.innerHTML = '';
                viewStates.forEach((state, index) => createView(state, index));
            }

            function addView() {
                viewStates.push({ metrics: [] }); // Initialize new view with empty metrics array
                renderDashboard();
            }

            function removeView(index) {
                viewStates.splice(index, 1);
                renderDashboard();
            }

            function init() {
                modal.style.display = 'none'; // Ensure modal is hidden on initial load
                addViewBtn.addEventListener('click', addView);
                closeModal.addEventListener('click', () => modal.style.display = 'none');
                addTraceBtn.addEventListener('click', addTraceToPlot);
                window.addEventListener('click', (event) => {
                    if (event.target == modal) {
                        modal.style.display = 'none';
                    }
                });

                fetchInitialData().then(() => {
                    if (viewStates.length === 0) {
                        addView();
                    } else {
                        renderDashboard();
                    }
                });
            }

            init();
        });
    </script>
</body>
</html>
