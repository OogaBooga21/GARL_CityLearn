<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>KPI Dashboard</h1>
        <button id="addViewBtn">Add View</button>
    </div>

    <div id="dashboard">
        <!-- Views will be dynamically inserted here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = document.getElementById('dashboard');
            const addViewBtn = document.getElementById('addViewBtn');

            // These will be populated by the Python script
            const availableRuns = ["RBC_nypc_20260307_223601", "RBC_evri_20260307_224245"];
            const availableKPIs = {"RBC_nypc_20260307_223601": [{"name": "Grid Consumption", "path": "grid_consumption.html"}, {"name": "Total Grid Consumption", "path": "total_grid_consumption.html"}, {"name": "Building Load", "path": "load.html"}, {"name": "Total Building Load", "path": "total_load.html"}, {"name": "Electricity Cost", "path": "cost.html"}, {"name": "Total Electricity Cost", "path": "total_cost.html"}, {"name": "PV Generation", "path": "pv_generation.html"}, {"name": "Total PV Generation", "path": "total_pv_generation.html"}, {"name": "Electrical Storage SoC", "path": "electrical_storage_soc.html"}, {"name": "Total Electrical Storage SoC", "path": "total_electrical_storage_soc.html"}, {"name": "Electrical Storage Action", "path": "electrical_storage_action.html"}, {"name": "Total Electrical Storage Action", "path": "total_electrical_storage_action.html"}, {"name": "Summary KPIs", "path": "summary_kpis.html"}], "RBC_evri_20260307_224245": [{"name": "Grid Consumption", "path": "grid_consumption.html"}, {"name": "Total Grid Consumption", "path": "total_grid_consumption.html"}, {"name": "Building Load", "path": "load.html"}, {"name": "Total Building Load", "path": "total_load.html"}, {"name": "Electricity Cost", "path": "cost.html"}, {"name": "Total Electricity Cost", "path": "total_cost.html"}, {"name": "PV Generation", "path": "pv_generation.html"}, {"name": "Total PV Generation", "path": "total_pv_generation.html"}, {"name": "Electrical Storage SoC", "path": "electrical_storage_soc.html"}, {"name": "Total Electrical Storage SoC", "path": "total_electrical_storage_soc.html"}, {"name": "Electrical Storage Action", "path": "electrical_storage_action.html"}, {"name": "Total Electrical Storage Action", "path": "total_electrical_storage_action.html"}, {"name": "Summary KPIs", "path": "summary_kpis.html"}]};

            // --- State Management ---
            let viewStates = [];

            function saveState() {
                localStorage.setItem('dashboardState', JSON.stringify(viewStates));
            }

            function loadState() {
                const savedState = localStorage.getItem('dashboardState');
                if (savedState) {
                    return JSON.parse(savedState);
                }
                // Default to one view if no state is saved
                return [{ run: availableRuns[0] || '', kpi: '' }];
            }

            // --- View Creation ---
            function createView(state, index) {
                const view = document.createElement('div');
                view.className = 'view';
                view.dataset.id = index;

                // Header
                const header = document.createElement('div');
                header.className = 'view-header';

                // Run Selector
                const runSelector = document.createElement('select');
                runSelector.className = 'run-selector';
                availableRuns.forEach(runId => {
                    const option = new Option(runId, runId, false, runId === state.run);
                    runSelector.add(option);
                });
                runSelector.addEventListener('change', (e) => {
                    viewStates[index].run = e.target.value;
                    // When run changes, reset KPI and update KPI selector
                    viewStates[index].kpi = ''; 
                    updateKPISelector(view, viewStates[index]);
                    updatePlot(view, viewStates[index]);
                    saveState();
                });

                // KPI Selector
                const kpiSelector = document.createElement('select');
                kpiSelector.className = 'kpi-selector';
                kpiSelector.addEventListener('change', (e) => {
                    viewStates[index].kpi = e.target.value;
                    updatePlot(view, viewStates[index]);
                    saveState();
                });

                // Close Button
                const closeBtn = document.createElement('button');
                closeBtn.className = 'close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.addEventListener('click', () => {
                    removeView(index);
                });

                header.appendChild(runSelector);
                header.appendChild(kpiSelector);
                header.appendChild(closeBtn);

                // Plot Container
                const plotContainer = document.createElement('div');
                plotContainer.className = 'plot-container';
                const iframe = document.createElement('iframe');
                plotContainer.appendChild(iframe);

                view.appendChild(header);
                view.appendChild(plotContainer);

                dashboard.appendChild(view);

                // Initial population
                updateKPISelector(view, state);
                updatePlot(view, state);
            }

            // --- Update Functions ---
            function updateKPISelector(view, state) {
                const kpiSelector = view.querySelector('.kpi-selector');
                kpiSelector.innerHTML = '<option value="">Select KPI</option>';
                const kpisForRun = availableKPIs[state.run] || [];
                kpisForRun.forEach(kpi => {
                    const option = new Option(kpi.name, kpi.path, false, kpi.path === state.kpi);
                    kpiSelector.add(option);
                });
            }

            function updatePlot(view, state) {
                const iframe = view.querySelector('iframe');
                if (state.run && state.kpi) {
                    iframe.src = `plots/${state.run}/${state.kpi}`;
                } else {
                    iframe.src = 'about:blank';
                }
            }
            
            // --- View Management ---
            function renderDashboard() {
                dashboard.innerHTML = '';
                viewStates.forEach((state, index) => {
                    createView(state, index);
                });
            }

            function addView() {
                const newRun = availableRuns.length > 0 ? availableRuns[0] : '';
                viewStates.push({ run: newRun, kpi: '' });
                saveState();
                renderDashboard();
            }

            function removeView(index) {
                viewStates.splice(index, 1);
                saveState();
                renderDashboard();
            }

            // --- Initialization ---
            function init() {
                addViewBtn.addEventListener('click', addView);
                viewStates = loadState();
                if (viewStates.length === 0 && availableRuns.length > 0) {
                   viewStates = [{ run: availableRuns[0] || '', kpi: '' }];
                }
                renderDashboard();
            }

            init();
        });
    </script>
</body>
</html>
