<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>

    <div class="header">
        <h1>KPI Dashboard</h1>
        <div class="header-controls">
            <div class="smoothing-control">
                <label for="smoothingSlider">
                    Smoothing: <span id="smoothingValue">0.00</span>
                </label>
                <input type="range" id="smoothingSlider" min="0" max="0.99" step="0.01" value="0">
            </div>
            <button id="addViewBtn">Add View</button>
        </div>
    </div>

    <div id="dashboard">
        <!-- Views will be dynamically inserted here -->
    </div>

    <!-- Modal for adding a new trace -->
    <div id="addTraceModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Add Metric to Plot</h2>
            <label class="modal-label">Run</label>
            <select id="modalRunSelector"></select>
            <label class="modal-label">Metric</label>
            <select id="modalKpiSelector"></select>
            <label class="modal-label">Color</label>
            <input type="color" id="modalColorPicker" value="#ff0000">
            <label class="modal-label">Line Style</label>
            <select id="modalLineType">
                <option value="solid">Solid</option>
                <option value="dot">Dotted</option>
                <option value="dash">Dashed</option>
            </select>
            <button id="addTraceBtn">Add Trace</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = document.getElementById('dashboard');
            const addViewBtn = document.getElementById('addViewBtn');
            const modal = document.getElementById('addTraceModal');
            const closeModal = document.querySelector('.close-button');
            const addTraceBtn = document.getElementById('addTraceBtn');
            const modalRunSelector = document.getElementById('modalRunSelector');
            const modalKpiSelector = document.getElementById('modalKpiSelector');
            const modalColorPicker = document.getElementById('modalColorPicker');
            const modalLineType = document.getElementById('modalLineType');
            const smoothingSlider = document.getElementById('smoothingSlider');
            const smoothingValueDisplay = document.getElementById('smoothingValue');

            let availableRuns = [];
            let availableKPIs = {};
            let viewStates = [];   // Each state: { metrics: [...], type: null|'chart'|'table' }
            let activeView = null;
            let smoothingWeight = 0;

            // ── Summary KPI metadata ──────────────────────────────────────────
            const SUMMARY_LABELS = {
                total_cost:                     { label: 'Total Cost',                  fmt: v => `$${fmt2(v)}` },
                total_carbon_emissions:         { label: 'Total Carbon Emissions',      fmt: v => `${fmt2(v)} kg CO₂` },
                max_consumption:                { label: 'Max Net Consumption',         fmt: v => `${fmt2(v)} kWh` },
                max_load:                       { label: 'Max Load',                    fmt: v => `${fmt2(v)} kWh` },
                total_load_energy:              { label: 'Total Load Energy',           fmt: v => `${fmt2(v)} kWh` },
                total_non_shiftable_energy:     { label: 'Total Non-Shiftable Energy',  fmt: v => `${fmt2(v)} kWh` },
                total_pv_generation:            { label: 'Total PV Generation',         fmt: v => `${fmt2(v)} kWh` },
                average_electrical_storage_soc: { label: 'Avg. Battery SoC',            fmt: v => `${(v * 100).toFixed(1)}%` },
                total_charged:                  { label: 'Total Charged',               fmt: v => `${fmt2(v)} kWh` },
                total_discharged:               { label: 'Total Discharged',            fmt: v => `${fmt2(v)} kWh` },
            };

            function fmt2(n) {
                return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function summaryMetricLabel(key) {
                if (SUMMARY_LABELS[key]) return SUMMARY_LABELS[key].label;
                // Building_N_charged / Building_N_discharged
                return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            }

            function summaryMetricValue(key, value) {
                if (SUMMARY_LABELS[key]) return SUMMARY_LABELS[key].fmt(value);
                if (/_charged$|_discharged$/.test(key)) return `${fmt2(value)} kWh`;
                return Number(value).toLocaleString('en-US', { maximumFractionDigits: 4 });
            }

            // ── Smoothing ─────────────────────────────────────────────────────────
            // TensorFlow-style exponential moving average.
            // weight=0 → raw data, weight→1 → maximally smooth trend line.
            function applySmoothing(data, weight) {
                if (weight === 0 || data.length === 0) return [...data];
                const result = [];
                let last = data[0];
                for (const value of data) {
                    last = last * weight + (1 - weight) * value;
                    result.push(last);
                }
                return result;
            }

            // ── Stats ─────────────────────────────────────────────────────────────
            function computeStats(data) {
                if (data.length === 0) return { min: 0, max: 0, avg: 0 };
                let min = data[0], max = data[0], sum = 0;
                for (const v of data) {
                    if (v < min) min = v;
                    if (v > max) max = v;
                    sum += v;
                }
                return { min, max, avg: sum / data.length };
            }

            function fmtNum(n) {
                // Compact number formatting for legend
                if (Math.abs(n) >= 1e4) return n.toExponential(2);
                return n.toFixed(2);
            }

            // ── Color helpers ─────────────────────────────────────────────────────
            function generateColorShades(hexColor, count) {
                const shades = [];
                const baseColor = parseInt(hexColor.slice(1), 16);
                let r = (baseColor >> 16) & 255;
                let g = (baseColor >> 8) & 255;
                let b = baseColor & 255;
                for (let i = 0; i < count; i++) {
                    const factor = 1 - (i * 0.08);
                    const newR = Math.max(0, Math.min(255, Math.round(r * factor)));
                    const newG = Math.max(0, Math.min(255, Math.round(g * factor)));
                    const newB = Math.max(0, Math.min(255, Math.round(b * factor)));
                    shades.push(`rgb(${newR},${newG},${newB})`);
                }
                return shades;
            }

            // ── Table view render ─────────────────────────────────────────────────
            function renderTableView(container, metrics) {
                if (metrics.length === 0) {
                    container.innerHTML = '<div class="table-empty">Add a Summary KPI run to see results here.</div>';
                    return;
                }

                // Collect all keys in order: top-level summary first, then per-building
                const allKeys = [...new Set(metrics.flatMap(m => Object.keys(m.summaryData)))];
                const topKeys      = allKeys.filter(k => !/^Building_\d+/.test(k));
                const buildingKeys = allKeys.filter(k =>  /^Building_\d+/.test(k));

                let html = '<div class="table-wrapper"><table class="kpi-table"><thead><tr><th>Metric</th>';
                for (const m of metrics) {
                    html += `<th style="border-top:3px solid ${m.color}">${m.run}</th>`;
                }
                html += '</tr></thead><tbody>';

                const renderRow = key => {
                    html += `<tr><td class="table-metric-name">${summaryMetricLabel(key)}</td>`;
                    for (const m of metrics) {
                        const v = m.summaryData[key];
                        html += `<td class="table-value">${v !== undefined ? summaryMetricValue(key, v) : '—'}</td>`;
                    }
                    html += '</tr>';
                };

                topKeys.forEach(renderRow);

                if (buildingKeys.length > 0) {
                    html += `<tr class="table-section-divider"><td colspan="${metrics.length + 1}">Per Building</td></tr>`;
                    buildingKeys.forEach(renderRow);
                }

                html += '</tbody></table></div>';
                container.innerHTML = html;
            }

            // ── Core render ───────────────────────────────────────────────────────
            // Builds all Plotly traces from stored raw data + current smoothing,
            // then does a full Plotly.newPlot (purge + recreate). This is simpler
            // and more reliable than Plotly.react for our use case.
            // preserveRange=true only when smoothing changes — at that point real
            // data is already rendered and the stored range is valid. When adding
            // or removing traces we always let Plotly auto-fit the new data.
            function renderViewPlot(viewIndex, preserveRange = false) {
                const view = dashboard.querySelector(`[data-id="${viewIndex}"]`);
                if (!view) return;
                const plotContainer = view.querySelector('.plot-container');
                const viewState = viewStates[viewIndex];
                const metrics = viewState.metrics || [];

                if (viewState.type === 'table') {
                    renderTableView(plotContainer, metrics);
                    return;
                }

                const traces = [];
                let yaxisTitle = '';

                metrics.forEach(metric => {
                    if (!metric.rawData) return;
                    metric.rawData.forEach(series => {
                        const smoothedY = applySmoothing(series.y, smoothingWeight);
                        const { min, max, avg } = computeStats(series.y);
                        const statsLine = `min: ${fmtNum(min)}  |  max: ${fmtNum(max)}  |  avg: ${fmtNum(avg)}`;

                        traces.push({
                            x: series.x,
                            y: smoothedY,
                            name: `${series.name}<br>${statsLine}`,
                            line: { color: series.color, dash: metric.lineType || 'solid' },
                            type: 'scatter',
                            mode: 'lines'
                        });
                    });
                    if (!yaxisTitle && metric.unit) yaxisTitle = metric.unit;
                });

                // Only capture the existing range when explicitly asked AND when
                // real data has already been plotted (so we never capture the
                // synthetic [0,1] default that Plotly sets on an empty plot).
                const hasExistingData = plotContainer.data && plotContainer.data.length > 0;
                const savedRange = preserveRange && hasExistingData
                    ? plotContainer.layout?.xaxis?.range
                    : undefined;

                Plotly.newPlot(plotContainer, traces, {
                    margin: { t: 30, r: 20, b: 60, l: 60 },
                    yaxis: { title: yaxisTitle },
                    xaxis: {
                        rangeslider: { visible: true, thickness: 0.07 },
                        ...(savedRange ? { range: savedRange } : {})
                    },
                    legend: {
                        orientation: 'v',
                        x: 1.02,
                        xanchor: 'left',
                        y: 1
                    }
                });
            }

            // ── Data fetching ─────────────────────────────────────────────────────
            async function fetchInitialData() {
                const response = await fetch('available_data.json');
                const data = await response.json();
                availableRuns = data.runs;
                availableKPIs = data.kpis;

                populateRunSelector(modalRunSelector, availableRuns);
                modalRunSelector.addEventListener('change', () => {
                    populateKpiSelector(modalKpiSelector, availableKPIs[modalRunSelector.value]);
                });
                if (availableRuns.length > 0) {
                    populateKpiSelector(modalKpiSelector, availableKPIs[availableRuns[0]]);
                }
            }

            function populateRunSelector(selector, runs) {
                selector.innerHTML = '';
                runs.forEach(runId => {
                    const option = new Option(runId, runId);
                    selector.add(option);
                });
            }

            function populateKpiSelector(selector, kpis) {
                selector.innerHTML = '';
                if (kpis) {
                    kpis.forEach(kpi => {
                        const option = new Option(kpi.name, kpi.path);
                        option.dataset.unit = kpi.unit;
                        selector.add(option);
                    });
                }
            }

            // ── Add trace ─────────────────────────────────────────────────────────
            async function addTraceToPlot() {
                if (!activeView) return;

                const run = modalRunSelector.value;
                const selectedOption = modalKpiSelector.options[modalKpiSelector.selectedIndex];
                const kpi = selectedOption.value;
                const unit = selectedOption.dataset.unit;
                const color = modalColorPicker.value;
                const lineType = modalLineType.value;
                const viewIndex = parseInt(activeView.dataset.id);
                const isSummary = kpi === 'summary_kpis';
                const viewType = viewStates[viewIndex].type;

                // Guard: summary KPIs can only go into empty or table views
                if (isSummary && viewType === 'chart') {
                    alert('Summary KPIs cannot be added to a chart view.\nAdd them to an empty view instead.');
                    return;
                }
                // Guard: chart KPIs cannot go into a table view
                if (!isSummary && viewType === 'table') {
                    alert('Chart metrics cannot be added to a Summary KPI table.\nUse a chart view or an empty view.');
                    return;
                }

                const response = await fetch(`/api/kpi/${run}/${kpi}`);
                const data = await response.json();

                if (!viewStates[viewIndex].metrics) viewStates[viewIndex].metrics = [];

                if (isSummary) {
                    // Flatten single-element arrays to scalars
                    const summaryData = {};
                    for (const [key, val] of Object.entries(data)) {
                        summaryData[key] = Array.isArray(val) ? val[0] : val;
                    }
                    viewStates[viewIndex].type = 'table';
                    viewStates[viewIndex].metrics.push({ run, kpi, color, summaryData });
                } else {
                    const yCols = Object.keys(data).filter(k => k !== 'timestamp');
                    const shades = generateColorShades(color, yCols.length);
                    const rawData = yCols.map((col, i) => ({
                        name: `${run} — ${col}`,
                        x: data.timestamp,
                        y: data[col],
                        color: shades[i]
                    }));
                    viewStates[viewIndex].type = 'chart';
                    viewStates[viewIndex].metrics.push({ run, kpi, color, unit, lineType, rawData, traceNames: rawData.map(s => s.name) });
                }

                renderViewPlot(viewIndex);
                renderTokens(activeView, viewIndex);
                modal.style.display = 'none';
            }

            // ── Remove trace ──────────────────────────────────────────────────────
            function removeTrace(viewIndex, metricIndex) {
                viewStates[viewIndex].metrics.splice(metricIndex, 1);
                if (viewStates[viewIndex].metrics.length === 0) {
                    viewStates[viewIndex].type = null;
                }
                renderViewPlot(viewIndex);
                const view = dashboard.querySelector(`[data-id="${viewIndex}"]`);
                renderTokens(view, viewIndex);
            }

            // ── Tokens ────────────────────────────────────────────────────────────
            function renderTokens(view, viewIndex) {
                const tokenContainer = view.querySelector('.token-container');
                tokenContainer.innerHTML = '';
                const metrics = viewStates[viewIndex].metrics || [];
                metrics.forEach((metric, metricIndex) => {
                    const token = document.createElement('span');
                    token.className = 'metric-token';
                    token.style.borderColor = metric.color;

                    const tokenText = document.createElement('span');
                    tokenText.innerText = `${metric.run} — ${metric.kpi}`;
                    token.appendChild(tokenText);

                    const closeTokenBtn = document.createElement('button');
                    closeTokenBtn.className = 'close-token-btn';
                    closeTokenBtn.innerHTML = '&times;';
                    closeTokenBtn.onclick = () => removeTrace(viewIndex, metricIndex);
                    token.appendChild(closeTokenBtn);

                    tokenContainer.appendChild(token);
                });
            }

            // ── View lifecycle ────────────────────────────────────────────────────
            function createView(state, index) {
                const view = document.createElement('div');
                view.className = 'view';
                view.dataset.id = index;

                const header = document.createElement('div');
                header.className = 'view-header';

                const tokenContainer = document.createElement('div');
                tokenContainer.className = 'token-container';

                const addTraceModalBtn = document.createElement('button');
                addTraceModalBtn.innerText = '+';
                addTraceModalBtn.addEventListener('click', () => {
                    activeView = view;
                    modal.style.display = 'flex';
                });

                const closeBtn = document.createElement('button');
                closeBtn.className = 'close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.addEventListener('click', () => removeView(index));

                header.appendChild(addTraceModalBtn);
                header.appendChild(tokenContainer);
                header.appendChild(closeBtn);

                const plotContainer = document.createElement('div');
                plotContainer.className = 'plot-container';

                view.appendChild(header);
                view.appendChild(plotContainer);
                dashboard.appendChild(view);

                renderViewPlot(index);
                renderTokens(view, index);
            }

            function renderDashboard() {
                dashboard.innerHTML = '';
                viewStates.forEach((state, index) => createView(state, index));
            }

            function addView() {
                viewStates.push({ metrics: [], type: null });
                renderDashboard();
            }

            function removeView(index) {
                viewStates.splice(index, 1);
                renderDashboard();
            }

            // ── Init ──────────────────────────────────────────────────────────────
            function init() {
                modal.style.display = 'none';

                addViewBtn.addEventListener('click', addView);
                closeModal.addEventListener('click', () => modal.style.display = 'none');
                addTraceBtn.addEventListener('click', addTraceToPlot);
                window.addEventListener('click', (event) => {
                    if (event.target === modal) modal.style.display = 'none';
                });

                smoothingSlider.addEventListener('input', () => {
                    smoothingWeight = parseFloat(smoothingSlider.value);
                    smoothingValueDisplay.textContent = smoothingWeight.toFixed(2);
                    viewStates.forEach((_, index) => renderViewPlot(index, true));
                });

                fetchInitialData().then(() => {
                    if (viewStates.length === 0) addView();
                    else renderDashboard();
                });
            }

            init();
        });
    </script>
</body>
</html>
