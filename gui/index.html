<!DOCTYPE html>
<html>
<head>
    <title>KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>KPI Dashboard</h1>
        <p>Add or remove plots to compare.</p>

        <div class="plot-area" id="plot-area">
            <!-- Plot selectors and add button will be dynamically inserted here -->
        </div>
    </div>

    <script>
        const plotFiles = [{"name": "Grid Consumption", "path": "plots/grid_consumption.html"}, {"name": "Total Grid Consumption", "path": "plots/total_grid_consumption.html"}, {"name": "Building Load", "path": "plots/load.html"}, {"name": "Total Building Load", "path": "plots/total_load.html"}, {"name": "Electricity Cost", "path": "plots/cost.html"}, {"name": "Total Electricity Cost", "path": "plots/total_cost.html"}, {"name": "PV Generation", "path": "plots/pv_generation.html"}, {"name": "Total PV Generation", "path": "plots/total_pv_generation.html"}, {"name": "Electrical Storage SoC", "path": "plots/electrical_storage_soc.html"}, {"name": "Total Electrical Storage SoC", "path": "plots/total_electrical_storage_soc.html"}, {"name": "Electrical Storage Action", "path": "plots/electrical_storage_action.html"}, {"name": "Total Electrical Storage Action", "path": "plots/total_electrical_storage_action.html"}, {"name": "Summary KPIs", "path": "plots/summary_kpis.html"}];
        let plotSelectorCounter = 0;
        const plotArea = document.getElementById('plot-area');

        function createPlotSelector() {
            plotSelectorCounter++;
            const selectorId = `plot-selector-${plotSelectorCounter}`;

            const plotSelector = document.createElement('div');
            plotSelector.className = 'plot-selector';
            plotSelector.id = selectorId;

            plotSelector.innerHTML = `
                <div class="plot-header">
                    <select id="plot-select-${plotSelectorCounter}" onchange="updatePlot('${plotSelectorCounter}')">
                        <option value="">-- Select a Plot --</option>
                    </select>
                    <button class="remove-btn" onclick="removePlotSelector('${selectorId}')">X</button>
                </div>
                <iframe id="plot-frame-${plotSelectorCounter}" src=""></iframe>
            `;
            
            return plotSelector;
        }

        function populateDropdown(num) {
            const select = document.getElementById(`plot-select-${num}`);
            if (!select) return; // Guard clause
            const buildingDetailsOption = new Option("Building Details", "plots/buildings.html");
            select.add(buildingDetailsOption);
            plotFiles.forEach(file => {
                const option = new Option(file.name, file.path);
                select.add(option);
            });
        }

        function updatePlot(num) {
            const select = document.getElementById(`plot-select-${num}`);
            const frame = document.getElementById(`plot-frame-${num}`);
            frame.src = select.value;
        }

        function removePlotSelector(selectorId) {
            const plotSelectors = plotArea.querySelectorAll('.plot-selector');
            if (plotSelectors.length <= 1) {
                alert("At least one plot must remain.");
                return;
            }
            const plotSelector = document.getElementById(selectorId);
            if (plotSelector) {
                plotSelector.remove();
                updateLayout();
            }
        }

        function addPlot() {
            const newPlot = createPlotSelector();
            plotArea.insertBefore(newPlot, document.getElementById('add-plot-btn-container'));
            populateDropdown(plotSelectorCounter);
            updateLayout();
        }

        function updateLayout() {
            const plotSelectors = plotArea.querySelectorAll('.plot-selector');
            const numPlots = plotSelectors.length;
            const addBtnContainer = document.getElementById('add-plot-btn-container');

            if (window.innerWidth >= 2000) { // Wide screen layout
                if (numPlots === 1) {
                    plotSelectors[0].style.width = 'calc(90% - 12px)';
                    addBtnContainer.style.width = 'calc(10% - 12px)';
                } else {
                    plotSelectors.forEach(ps => {
                        ps.style.width = 'calc(50% - 22px)';
                    });
                    addBtnContainer.style.width = 'calc(50% - 22px)';
                }
            } else { // Narrow screen layout
                plotSelectors.forEach(ps => {
                    ps.style.width = '100%';
                });
                addBtnContainer.style.width = '100%';
            }
        }

        // Initial Setup
        window.onload = function() {
            // Create and append the add button
            const addBtnContainer = document.createElement('div');
            addBtnContainer.id = 'add-plot-btn-container';
            addBtnContainer.innerHTML = '<span id="add-plot-btn">+</span>';
            addBtnContainer.onclick = addPlot;
            plotArea.appendChild(addBtnContainer);

            // Add the first plot
            addPlot();
        };

        window.onresize = updateLayout;

    </script>
</body>
</html>
